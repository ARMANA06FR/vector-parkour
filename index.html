<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Vector Parkour</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#050508;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;color:#fff}
#gameContainer{position:relative;width:100%;max-width:960px;box-shadow:0 0 60px rgba(0,200,255,.12);border:1px solid #1a1a30;border-radius:10px;overflow:hidden}
canvas{display:block;width:100%;height:auto;background:#080810}
#ui{position:absolute;top:0;left:0;width:100%;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;gap:6px;flex-wrap:wrap}
.score-box{background:rgba(8,8,20,.75);padding:6px 12px;border-radius:8px;border:1px solid rgba(0,229,255,.25);font-size:13px;font-weight:600;letter-spacing:1px;backdrop-filter:blur(4px)}
#powerUI{display:flex;gap:5px;flex-wrap:wrap}
.power-tag{background:rgba(0,0,0,.7);border-radius:6px;padding:3px 8px;font-size:11px;border:1px solid;display:none}
.progress-bar{position:absolute;bottom:0;left:0;height:4px;background:linear-gradient(90deg,#00e5ff,#7c4dff);width:0%;z-index:15;box-shadow:0 0 8px rgba(0,229,255,.5)}
#flash{position:absolute;inset:0;pointer-events:none;z-index:18;opacity:0}
#overlay{position:absolute;inset:0;background:rgba(4,4,12,.94);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20;text-align:center;padding:16px;overflow-y:auto}
h1{font-size:2.6rem;margin-bottom:4px;background:linear-gradient(90deg,#00e5ff,#7c4dff,#00e5ff);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:5px;animation:shine 3s linear infinite}
@keyframes shine{to{background-position:200% center}}
.subtitle{color:#777;margin-bottom:12px;font-size:.85rem;letter-spacing:3px;text-transform:uppercase}
.btn{background:linear-gradient(135deg,#00bcd4,#7c4dff);border:none;color:#fff;padding:12px 32px;font-size:1rem;font-weight:600;border-radius:30px;cursor:pointer;transition:transform .15s,box-shadow .15s;margin:5px;pointer-events:auto;letter-spacing:1px}
.btn:hover{transform:scale(1.05);box-shadow:0 0 24px rgba(0,188,212,.5)}
.btn.secondary{background:linear-gradient(135deg,#333,#555)}
.btn.endless{background:linear-gradient(135deg,#ff9100,#ff1744)}
.controls{margin-top:10px;color:#888;font-size:.78rem;line-height:1.6}
.controls kbd{background:#1a1a2e;padding:2px 6px;border-radius:4px;border:1px solid #333;font-family:monospace;color:#00e5ff}
#levelGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:440px;margin:10px auto;pointer-events:auto;max-height:240px;overflow-y:auto}
.level-btn{background:rgba(20,20,40,.9);border:1px solid #333;border-radius:8px;padding:8px 3px;cursor:pointer;transition:all .15s;color:#ccc;font-size:.8rem;font-weight:600}
.level-btn:hover:not(:disabled){border-color:#00e5ff;color:#00e5ff;transform:scale(1.04)}
.level-btn.unlocked{border-color:#00e5ff55}
.level-btn.completed{border-color:#00e676;color:#00e676}
.level-btn:disabled{opacity:.3;cursor:not-allowed}
.level-btn .stars{font-size:.65rem;margin-top:2px;letter-spacing:1px}
.level-btn .best{font-size:.6rem;color:#666;margin-top:1px}
#msgTitle{font-size:1.8rem;margin-bottom:6px;letter-spacing:3px}
#msgScore{font-size:1.3rem;color:#00e5ff;margin:6px 0;text-shadow:0 0 16px rgba(0,229,255,.4)}
#msgSub{color:#777;margin-bottom:10px;font-size:.85rem}
.stars-display{font-size:1.5rem;letter-spacing:5px;margin:4px 0 10px}
.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#556;font-size:.75rem;pointer-events:none;transition:opacity 1s}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin-top:8px;font-size:.7rem;color:#777;max-width:520px}
#muteBtn{position:absolute;top:10px;right:14px;z-index:25;background:rgba(0,0,0,.6);border:1px solid #333;color:#aaa;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;pointer-events:auto}
#muteBtn:hover{border-color:#00e5ff;color:#00e5ff}
.lives{color:#ff5252;letter-spacing:2px}
#comboUI{position:absolute;top:50%;left:50%;transform:translate(-50%,-80%);font-size:1.4rem;font-weight:700;color:#ffd600;text-shadow:0 0 12px rgba(255,214,0,.6);opacity:0;pointer-events:none;z-index:12;transition:opacity .2s;letter-spacing:2px}
#tut{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 16px;border-radius:8px;border:1px solid #00e5ff55;font-size:.85rem;color:#00e5ff;pointer-events:none;z-index:12;display:none;white-space:nowrap}
</style>

// ─── AUDIO ───
const SFX={
ctx:null,muted:localStorage.getItem('vectorMuted')==='1',master:null,musicGain:null,musicNodes:[],musicOn:false,
init(){if(this.ctx)return;this.ctx=new(window.AudioContext||window.webkitAudioContext)();
this.master=this.ctx.createGain();this.master.gain.value=this.muted?0:.32;this.master.connect(this.ctx.destination);
this.musicGain=this.ctx.createGain();this.musicGain.gain.value=this.muted?0:.08;this.musicGain.connect(this.ctx.destination);
muteBtn.textContent=this.muted?'🔇':'🔊';},
resume(){this.init();if(this.ctx.state==='suspended')this.ctx.resume();},
toggleMute(){this.init();this.muted=!this.muted;this.master.gain.value=this.muted?0:.32;this.musicGain.gain.value=this.muted?0:.08;
localStorage.setItem('vectorMuted',this.muted?'1':'0');muteBtn.textContent=this.muted?'🔇':'🔊';},
tone(f,type,dur,vol=.3,slide=0,delay=0){if(!this.ctx||this.muted)return;const t=this.ctx.currentTime+delay;const o=this.ctx.createOscillator(),g=this.ctx.createGain();
o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(f+slide,t+dur);
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.05);},
noise(dur,vol=.2,ff=1000){if(!this.ctx||this.muted)return;const t=this.ctx.currentTime;const buf=this.ctx.createBuffer(1,this.ctx.sampleRate*dur,this.ctx.sampleRate);
const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=this.ctx.createBufferSource();s.buffer=buf;
const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=ff;const g=this.ctx.createGain();
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(this.master);s.start(t);s.stop(t+dur+.05);},
jump(){this.tone(280,'square',.08,.15,200);this.tone(400,'sine',.12,.1,150,.05);},
doubleJump(){this.tone(360,'square',.07,.12,250);this.tone(520,'sine',.1,.08,180,.04);},
slide(){this.noise(.15,.12,800);this.tone(120,'sawtooth',.12,.08,-40);},
star(){this.tone(660,'sine',.1,.15,200);this.tone(880,'sine',.12,.12,100,.06);},
powerup(){this.tone(440,'square',.08,.18);this.tone(554,'square',.08,.15,0,.07);this.tone(659,'square',.1,.12,0,.14);},
shieldBreak(){this.noise(.2,.25,1500);this.tone(200,'sawtooth',.15,.2,-100);},
hurt(){this.noise(.2,.22,700);this.tone(150,'sawtooth',.18,.18,-80);},
death(){this.noise(.4,.35,400);this.tone(300,'sawtooth',.15,.2,-150);this.tone(80,'square',.4,.15,-40,.2);},
complete(){[523,659,784,1046].forEach((n,i)=>this.tone(n,'sine',.25,.15,50,i*.12));},
footstep(){this.noise(.04,.05,400);},
life(){this.tone(523,'sine',.12,.15);this.tone(784,'sine',.2,.1,0,.12);},
vault(){this.tone(500,'square',.06,.2,300);this.tone(700,'sine',.15,.15,200,.05);this.tone(900,'sine',.2,.1,100,.1);},
combo(){this.tone(800,'sine',.08,.12,400);},
startMusic(){
if(!this.ctx||this.musicOn)return;this.musicOn=true;
const notes=[110,130.8,146.8,164.8,130.8,110,98,110];
let step=0;
const beat=()=>{
if(!this.musicOn||this.muted){setTimeout(beat,400);return;}
const t=this.ctx.currentTime;
const o=this.ctx.createOscillator(),g=this.ctx.createGain();
o.type='triangle';o.frequency.value=notes[step%notes.length];
g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);
o.connect(g);g.connect(this.musicGain);o.start(t);o.stop(t+.4);
// bass
if(step%2===0){const o2=this.ctx.createOscillator(),g2=this.ctx.createGain();
o2.type='sine';o2.frequency.value=notes[step%notes.length]/2;
g2.gain.setValueAtTime(.15,t);g2.gain.exponentialRampToValueAtTime(.001,t+.5);
o2.connect(g2);g2.connect(this.musicGain);o2.start(t);o2.stop(t+.55);}
step++;setTimeout(beat,380);
};beat();
},
stopMusic(){this.musicOn=false;}
};
muteBtn.addEventListener('click',()=>SFX.toggleMute());

function burst(x,y,c,n=12,spd=5){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,f=spd*(.4+Math.random());particles.push({x,y,vx:Math.cos(a)*f,vy:Math.sin(a)*f,life:20+Math.random()*20,maxLife:40,size:2+Math.random()*3,color:c,type:'spark'});}}
function ringBurst(x,y,c){for(let i=0;i<16;i++){const a=(i/16)*Math.PI*2;particles.push({x:x+Math.cos(a)*5,y:y+Math.sin(a)*5,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:25,maxLife:25,size:2.5,color:c,type:'spark'});}}

function makeObstacle(type,wx){
const b={x:wx,vaulted:false};
if(type==='low')return{...b,y:groundY-38,w:24,h:38,type,color:'#ff1744',glow:'#ff1744'};
if(type==='high')return{...b,y:groundY-108,w:55,h:58,type,color:'#ff9100',glow:'#ff9100'};
if(type==='mid')return{...b,y:groundY-52,w:36,h:52,type,color:'#e040fb',glow:'#e040fb'};
if(type==='wide')return{...b,y:groundY-34,w:60,h:34,type,color:'#ff1744',glow:'#ff5252'};
if(type==='mine')return{...b,y:groundY-14,w:22,h:14,type,color:'#ffeb3b',glow:'#ffeb3b',armed:true};
return{...b,y:groundY-40,w:28,h:40,type:'low',color:'#ff1744',glow:'#ff1744'};
}
function makeEnemy(type,wx){
if(type==='drone')return{type:'drone',x:wx,y:groundY-140-Math.random()*40,w:28,h:18,baseY:0,phase:Math.random()*Math.PI*2,amp:25+Math.random()*20,speedY:.04+Math.random()*.03,color:'#ff1744'};

}

function makeWall(wx){return{x:wx,y:groundY-160,w:18,h:160};}

function initBackground(){
buildingsFar=[];buildingsMid=[];buildingsNear=[];neonSigns=[];starsBg=[];rain=[];
for(let i=0;i<10;i++)buildingsFar.push({x:i*160+Math.random()*30,w:70+Math.random()*90,h:100+Math.random()*160,type:Math.floor(Math.random()*3)});
for(let i=0;i<9;i++)buildingsMid.push({x:i*180+Math.random()*40,w:90+Math.random()*110,h:140+Math.random()*200,type:Math.floor(Math.random()*4),windows:true});
for(let i=0;i<7;i++)buildingsNear.push({x:i*220+Math.random()*50,w:100+Math.random()*130,h:180+Math.random()*220,type:Math.floor(Math.random()*4),windows:true,neon:Math.random()>.5});
for(let i=0;i<60;i++)starsBg.push({x:Math.random()*canvas.width,y:Math.random()*(groundY-80),size:Math.random()*1.8+.4,alpha:.2+Math.random()*.6,twinkle:Math.random()*Math.PI*2});
for(let i=0;i<5;i++)neonSigns.push({x:200+i*280+Math.random()*60,y:80+Math.random()*120,w:40+Math.random()*50,h:8+Math.random()*6,color:['#00e5ff','#7c4dff','#ff1744','#00e676','#ff9100'][i%5],alpha:.4+Math.random()*.4});
for(let i=0;i<40;i++)rain.push({x:Math.random()*canvas.width,y:Math.random()*groundY,len:8+Math.random()*12,spd:4+Math.random()*4});
}

function setupLevel(idx){
isEndless=false;currentLevel=idx;const lvl=LEVELS[idx];
levelDist=lvl.distance;baseLevelSpeed=lvl.speed;speed=baseLevelSpeed;
distance=0;frame=0;starsCollected=0;lives=MAX_LIVES;score=0;combo=0;comboTimer=0;vaultCount=0;
obstacles=[];enemies=[];powerups=[];starPickups=[];particles=[];confetti=[];walls=[];
hitStop=0;shakeTimer=0;flashAlpha=0;slowMo=0;levelStartTime=performance.now();
player.y=groundY-player.height;player.vy=0;player.grounded=true;player.sliding=false;
player.slideTimer=0;player.jumpCount=0;player.runFrame=0;player.trail=[];player.wallRun=0;
player.shield=0;player.speedBoost=0;player.magnet=0;player.superJump=0;player.invincible=0;player.maxJumps=2;
guard={x:-80,threat:0};
lvl.pattern.forEach(p=>{
const wx=p.at*levelDist+250;
if(['low','high','mid','wide','mine'].includes(p.type)){
obstacles.push(makeObstacle(p.type,wx));
if(p.type!=='mine'&&Math.random()>.35)starPickups.push(makeStar(wx-70,p.type==='high'?groundY-50:groundY-100));
}else if(['drone','scanner','bot'].includes(p.type)){
const e=makeEnemy(p.type,wx);if(e){if(e.type==='drone')e.baseY=e.y;enemies.push(e);}
}else if(['shield','speed','magnet','jump','life'].includes(p.type))powerups.push(makePowerup(p.type,wx));
});
// Wall-run panels on mid+ levels
if(idx>=2){
for(let i=0;i<2+Math.floor(idx/3);i++){
walls.push(makeWall((.2+Math.random()*.6)*levelDist+250));
}
}
for(let i=0;i<4+idx;i++)starPickups.push(makeStar((.1+Math.random()*.8)*levelDist+200,groundY-70-Math.random()*50));
finishLine={x:levelDist+180,w:20,activated:false};
levelNumEl.textContent=idx+1;distMaxEl.textContent=Math.round(levelDist/10);
distLabel.textContent='0';starsUI.textContent='0';livesUI.textContent=lives;scoreUI.textContent='0';
progressBar.style.width='0%';updatePowerUI();initBackground();
// Tutorial level 1
if(idx===0){showTut('Saute avec ESPACE / ↑');setTimeout(()=>showTut('Glisse avec ↓ sous les obstacles hauts'),4000);setTimeout(()=>showTut('Vault : saute juste avant un obstacle bas !'),8000);setTimeout(()=>hideTut(),12000);}
else hideTut();
}

function setupEndless(){
isEndless=true;currentLevel=-1;levelDist=999999;baseLevelSpeed=6.5;speed=6.5;
distance=0;frame=0;starsCollected=0;lives=MAX_LIVES;score=0;combo=0;comboTimer=0;vaultCount=0;endlessSpawn=0;
obstacles=[];enemies=[];powerups=[];starPickups=[];particles=[];confetti=[];walls=[];
hitStop=0;shakeTimer=0;flashAlpha=0;slowMo=0;levelStartTime=performance.now();
player.y=groundY-player.height;player.vy=0;player.grounded=true;player.sliding=false;
player.slideTimer=0;player.jumpCount=0;player.runFrame=0;player.trail=[];player.wallRun=0;
player.shield=0;player.speedBoost=0;player.magnet=0;player.superJump=0;player.invincible=0;
guard={x:-80,threat:0};finishLine=null;
levelNumEl.textContent='∞';distMaxEl.textContent='∞';
distLabel.textContent='0';starsUI.textContent='0';livesUI.textContent=lives;scoreUI.textContent='0';
progressBar.style.width='0%';updatePowerUI();initBackground();hideTut();
}

function updatePowerUI(){
tagShield.style.display=player.shield>0?'block':'none';
tagSpeed.style.display=player.speedBoost>0?'block':'none';
tagMagnet.style.display=player.magnet>0?'block':'none';
tagJump.style.display=player.superJump>0?'block':'none';
}
function showTut(msg){tutEl.textContent=msg;tutEl.style.display='block';}
function hideTut(){tutEl.style.display='none';}
function showCombo(n){comboUI.textContent=n>=5?'MEGA COMBO x'+n:'COMBO x'+n;comboUI.style.opacity='1';setTimeout(()=>{comboUI.style.opacity='0';},800);}
function addScore(pts){const m=Math.max(1,combo);score+=Math.floor(pts*m);scoreUI.textContent=score;}
function addCombo(){combo++;comboTimer=120;showCombo(combo);SFX.combo();addScore(50);}

function showMenu(){
gameState='menu';progressBar.style.width='0%';SFX.stopMusic();updatePowerUI();
let grid='';
for(let i=0;i<LEVELS.length;i++){
const ok=i<unlocked,done=levelStars[i]!==undefined,st=levelStars[i]||0;
const bt=bestTimes[i]?((bestTimes[i]/1000).toFixed(1)+'s'):'';
grid+=`<button class="level-btn ${ok?'unlocked':''} ${done?'completed':''}" data-lvl="${i}" ${ok?'':'disabled'}>
${i+1}<div style="font-size:.6rem;color:#888;margin-top:1px">${LEVELS[i].name}</div>
<div class="stars">${done?'★'.repeat(st)+'☆'.repeat(3-st):''}</div>
${bt?`<div class="best">${bt}</div>`:''}</button>`;
}
const endlessUnlocked=unlocked>=4;
overlay.innerHTML=`<h1>VECTOR</h1><div class="subtitle">Parkour Runner · 12 Niveaux + Infini</div>
<div id="levelGrid">${grid}</div>
<button class="btn endless" id="endlessBtn" ${endlessUnlocked?'':'disabled style="opacity:.4"'}>MODE INFINI ∞</button>
<div class="legend">
<span style="color:#ff1744">● Drone</span><span style="color:#ff5252">● Bot</span><span style="color:#ffeb3b">◆ Mine</span>
<span style="color:#00e676">🛡</span><span style="color:#ff9100">⚡</span><span style="color:#e040fb">🧲</span><span style="color:#ff5252">♥</span>
<span style="color:#ffd600">Vault = Combo</span>
</div>
<div class="controls"><kbd>ESPACE</kbd> Sauter · <kbd>↓</kbd> Glisser · Évite le garde derrière toi</div>`;
overlay.style.display='flex';
document.querySelectorAll('.level-btn').forEach(btn=>btn.addEventListener('click',()=>{SFX.resume();SFX.startMusic();startLevel(parseInt(btn.dataset.lvl));}));
const eb=document.getElementById('endlessBtn');
if(endlessUnlocked)eb.onclick=()=>{SFX.resume();SFX.startMusic();startEndless();};
}

function showDeath(){
gameState='dead';updatePowerUI();SFX.death();SFX.stopMusic();screenShake(14,20);flash('#ff1744',.5);
const elapsed=((performance.now()-levelStartTime)/1000).toFixed(1);
overlay.innerHTML=`<div id="msgTitle" style="color:#ff1744">${isEndless?'GAME OVER':'ATTRAPÉ'}</div>
<div id="msgSub">${isEndless?'Mode Infini':('Niveau '+(currentLevel+1)+' — '+LEVELS[currentLevel].name)}</div>
<div id="msgScore">${Math.round(distance/10)} m · Score ${score}</div>
<div style="color:#888;font-size:.85rem;margin-bottom:10px">${elapsed}s · ${vaultCount} vaults · Combo max</div>
<button class="btn" id="retryBtn">RÉESSAYER</button><button class="btn secondary" id="menuBtn">MENU</button>`;
overlay.style.display='flex';
document.getElementById('retryBtn').onclick=()=>{SFX.resume();SFX.startMusic();isEndless?startEndless():startLevel(currentLevel);};
document.getElementById('menuBtn').onclick=showMenu;
}

function showComplete(starsEarned){
gameState='complete';SFX.complete();spawnConfetti();flash('#00e676',.35);
const elapsed=performance.now()-levelStartTime;
const prevT=bestTimes[currentLevel];
if(!prevT||elapsed<prevT){bestTimes[currentLevel]=Math.floor(elapsed);localStorage.setItem('vectorTimes',JSON.stringify(bestTimes));}
if(currentLevel+1>=unlocked&&currentLevel+1<LEVELS.length){unlocked=currentLevel+2;localStorage.setItem('vectorUnlocked',unlocked);}
const prev=levelStars[currentLevel]||0;
if(starsEarned>prev){levelStars[currentLevel]=starsEarned;localStorage.setItem('vectorStars',JSON.stringify(levelStars));}
const isLast=currentLevel>=LEVELS.length-1;
const newBest=!prevT||elapsed<prevT;
overlay.innerHTML=`<div id="msgTitle" style="color:#00e676">NIVEAU RÉUSSI</div>
<div id="msgSub">${LEVELS[currentLevel].name}</div>
<div class="stars-display">${'★'.repeat(starsEarned)}${'☆'.repeat(3-starsEarned)}</div>
<div id="msgScore">${Math.round(levelDist/10)} m · Score ${score}</div>
<div style="color:${newBest?'#ffd600':'#888'};font-size:.85rem;margin-bottom:8px">${(elapsed/1000).toFixed(1)}s ${newBest?'★ RECORD !':''} · ${vaultCount} vaults</div>
${!isLast?`<button class="btn" id="nextBtn">NIVEAU SUIVANT</button>`:`<div style="color:#00e5ff;margin:10px 0">Tous les niveaux terminés ! Mode Infini débloqué</div>`}
<button class="btn secondary" id="menuBtn2">MENU</button>`;
overlay.style.display='flex';
if(!isLast)document.getElementById('nextBtn').onclick=()=>{SFX.resume();startLevel(currentLevel+1);};
document.getElementById('menuBtn2').onclick=showMenu;
}

function startLevel(idx){setupLevel(idx);gameState='playing';overlay.style.display='none';hintEl.style.display='block';hintEl.style.opacity='1';setTimeout(()=>{hintEl.style.opacity='0';},4000);}
function startEndless(){setupEndless();gameState='playing';overlay.style.display='none';hintEl.style.display='block';hintEl.style.opacity='1';setTimeout(()=>{hintEl.style.opacity='0';},3000);}

function hitPlayer(){
if(player.invincible>0||player.wallRun>0)return;
if(player.shield>0){
player.shield=0;player.invincible=50;SFX.shieldBreak();screenShake(6,10);flash('#00e676',.35);
ringBurst(player.x+15,player.y+25,'#00e676');updatePowerUI();combo=0;return;
}
lives--;livesUI.textContent=lives;player.invincible=70;hitStop=6;combo=0;
screenShake(10,14);flash('#ff1744',.4);burst(player.x+15,player.y+25,'#ff1744',16,6);
guard.threat+=30; // guard closes in on hit
if(lives<=0){showDeath();return;}
SFX.hurt();
}

function doVault(o){
if(o.vaulted)return;
o.vaulted=true;vaultCount++;
player.speedBoost=Math.max(player.speedBoost,45); // short boost
slowMo=8;SFX.vault();addCombo();
flash('#ffd600',.2);burst(o.screenX+o.w/2,o.y,'#ffd600',14,5);
addScore(100);
}

function jump(){
if(gameState!=='playing')return;
// Wall-run jump extend
if(player.wallRun>0){player.vy=jumpForce*1.05;player.wallRun=0;player.jumpCount=1;SFX.doubleJump();burst(player.x+15,player.y+30,'#00e5ff',8,4);return;}
const maxJ=player.superJump>0?3:player.maxJumps;
if(player.jumpCount<maxJ){
player.vy=(player.superJump>0?jumpForce*1.12:jumpForce)*(player.jumpCount===0?1:.9);
player.grounded=false;player.jumpCount++;player.sliding=false;
if(player.jumpCount===1)SFX.jump();else SFX.doubleJump();
burst(player.x+15,player.y+player.height,player.superJump>0?'#00e5ff':'#7c4dff',8,4);
}
}
function startSlide(){
if(gameState!=='playing')return;
if(player.grounded&&!player.sliding){
player.sliding=true;player.slideTimer=38;SFX.slide();
for(let i=0;i<6;i++)particles.push({x:player.x+10,y:player.y+player.height-5,vx:-speed*.4+(Math.random()-.5)*3,vy:-Math.random()*2,life:16,maxLife:16,size:2,color:'#557',type:'dust'});
}
}

window.addEventListener('keydown',e=>{
keys[e.code]=true;SFX.resume();
if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(gameState==='playing')jump();}
if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();startSlide();}
});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
canvas.addEventListener('mousedown',e=>{
SFX.resume();if(gameState!=='playing')return;
const rect=canvas.getBoundingClientRect();const y=(e.clientY-rect.top)/rect.height*canvas.height;
if(y>canvas.height*.55)startSlide();else jump();
});
canvas.addEventListener('touchstart',e=>{
e.preventDefault();SFX.resume();if(gameState!=='playing')return;
const t=e.touches[0];const rect=canvas.getBoundingClientRect();const y=(t.clientY-rect.top)/rect.height*canvas.height;
if(y>canvas.height*.55)startSlide();else jump();
},{passive:false});

function spawnEndless(){
const r=Math.random();
const wx=distance+canvas.width+80;
if(r<.3)obstacles.push(makeObstacle('low',wx));
else if(r<.5)obstacles.push(makeObstacle('high',wx));
else if(r<.62)obstacles.push(makeObstacle('mid',wx));
else if(r<.72)obstacles.push(makeObstacle('mine',wx));
else if(r<.82){const e=makeEnemy('drone',wx);if(e){e.baseY=e.y;enemies.push(e);}}
else if(r<.9){const e=makeEnemy('bot',wx);if(e)enemies.push(e);}
else if(r<.95){const e=makeEnemy('scanner',wx);if(e)enemies.push(e);}
else powerups.push(makePowerup(['shield','speed','magnet','jump','life'][Math.floor(Math.random()*5)],wx));
if(Math.random()>.5)starPickups.push(makeStar(wx-60,groundY-80-Math.random()*40));
if(Math.random()>.85)walls.push(makeWall(wx+100));
}

function update(){
if(shakeTimer>0){shakeTimer--;shakeX=(Math.random()-.5)*shakeTimer*1.2;shakeY=(Math.random()-.5)*shakeTimer*1.2;}else{shakeX=0;shakeY=0;}
if(flashAlpha>0){flashAlpha*=.85;flashEl.style.opacity=flashAlpha;if(flashAlpha<.02){flashAlpha=0;flashEl.style.opacity=0;}}
if(slowMo>0)slowMo--;
confetti.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.25;c.rot+=c.rotV;c.life--;});confetti=confetti.filter(c=>c.life>0);
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;});particles=particles.filter(p=>p.life>0);
rain.forEach(r=>{r.y+=r.spd;r.x-=speed*.15;if(r.y>groundY){r.y=-10;r.x=Math.random()*canvas.width;}});
if(hitStop>0){hitStop--;return;}
if(gameState!=='playing')return;

const dt=slowMo>0?0.4:1;
frame++;
speed=(baseLevelSpeed+(player.speedBoost>0?2.8:0)+(isEndless?Math.min(distance/8000,4):0))*dt;
distance+=speed;
distLabel.textContent=Math.round(distance/10);
if(!isEndless)progressBar.style.width=Math.min(100,(distance/levelDist)*100)+'%';
else progressBar.style.width='100%';

if(comboTimer>0){comboTimer--;if(comboTimer<=0)combo=0;}
if(player.shield>0)player.shield--;if(player.speedBoost>0)player.speedBoost--;
if(player.magnet>0)player.magnet--;if(player.superJump>0)player.superJump--;
if(player.invincible>0)player.invincible--;if(player.wallRun>0)player.wallRun--;
if(frame%10===0)updatePowerUI();

// Endless spawn
if(isEndless){
endlessSpawn++;
const interval=Math.max(25,55-Math.floor(distance/2000));
if(endlessSpawn>interval){endlessSpawn=0;spawnEndless();}
}

player.vy+=gravity*dt;player.y+=player.vy*dt;
if(player.y+player.height>=groundY){player.y=groundY-player.height;player.vy=0;player.grounded=true;player.jumpCount=0;player.wallRun=0;}
else player.grounded=false;
if(player.sliding){player.slideTimer--;if(player.slideTimer<=0)player.sliding=false;}
if((keys['ArrowDown']||keys['KeyS'])&&player.grounded){player.sliding=true;player.slideTimer=12;}
player.runFrame+=speed*.18;
if(player.grounded&&!player.sliding&&frame-lastFootstep>(14-speed)){lastFootstep=frame;if(Math.random()>.4)SFX.footstep();}
if(frame%2===0)player.trail.push({x:player.x,y:player.y,sliding:player.sliding,life:8});
player.trail.forEach(t=>t.life--);player.trail=player.trail.filter(t=>t.life>0);

const w2s=wx=>wx-distance+player.x;

// Guard pursuer
guard.x+=speed*0.15; // slowly gains if player is "slow" relative - actually tracks behind
// Guard world position trails behind player by a margin that shrinks with threat
const guardMargin=200-guard.threat;
const targetGuardWorld=distance-guardMargin;
guard.x+=(targetGuardWorld-guard.x)*0.02;
guard.threat=Math.max(0,guard.threat-0.08);
if(guard.threat>100||(distance-guard.x)<40){ // caught!
hitPlayer();
if(gameState==='playing'){guard.threat=20;guard.x=distance-180;}
}

// Walls (wall-run)
for(let i=walls.length-1;i>=0;i--){
const w=walls[i];const sx=w2s(w.x);w.screenX=sx;
if(sx+w.w<-30){walls.splice(i,1);continue;}
// Touching wall while airborne
if(!player.grounded&&player.x+player.width>sx&&player.x<sx+w.w&&
player.y+player.height>w.y&&player.y<w.y+w.h){
if(player.wallRun<=0){player.wallRun=40;player.vy=Math.min(player.vy,1);player.jumpCount=0;}
}
}

// Obstacles + vault detection
for(let i=obstacles.length-1;i>=0;i--){
const o=obstacles[i];const sx=w2s(o.x);o.screenX=sx;
if(sx+o.w<-50){obstacles.splice(i,1);continue;}if(sx>canvas.width+50)continue;

// Vault window: jumping over low/wide/mine with good timing (player bottom near obstacle top, moving up or peak)
if(!o.vaulted&&(o.type==='low'||o.type==='wide')&&!player.grounded&&player.vy>-4){
const nearX=player.x+player.width>sx-8&&player.x<sx+o.w+8;
const nearY=player.y+player.height>o.y-25&&player.y+player.height<o.y+o.h+5;
if(nearX&&nearY){doVault(o);continue;}
}

const pTop=player.sliding?player.y+30:player.y,pH=player.sliding?28:player.height;
if(player.x<sx+o.w&&player.x+player.width>sx&&pTop<o.y+o.h&&pTop+pH>o.y){
if(o.type==='mine'){burst(sx+11,o.y,'#ffeb3b',20,7);obstacles.splice(i,1);}
hitPlayer();if(gameState!=='playing')return;
}
}

// Enemies
for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];
if(e.type==='drone'){e.phase+=e.speedY;e.y=e.baseY+Math.sin(e.phase)*e.amp;}
else if(e.type==='scanner'){e.beamH+=e.beamDir*e.beamSpeed;if(e.beamH>=e.maxBeam){e.beamH=e.maxBeam;e.beamDir=-1;}if(e.beamH<=0){e.beamH=0;e.beamDir=1;}}
else if(e.type==='bot'){e.x+=e.vx;e.phase+=.15;}
const sx=w2s(e.x);e.screenX=sx;
if(sx+(e.w||20)<-60){enemies.splice(i,1);continue;}if(sx>canvas.width+80)continue;
if(e.type==='drone'&&player.x<sx+e.w&&player.x+player.width>sx&&player.y<e.y+e.h&&player.y+(player.sliding?28:player.height)>e.y){hitPlayer();if(gameState!=='playing')return;}
if(e.type==='bot'&&player.x<sx+e.w&&player.x+player.width>sx&&player.y+(player.sliding?30:0)<e.y+e.h&&player.y+(player.sliding?28:player.height)>e.y){hitPlayer();if(gameState!=='playing')return;}
if(e.type==='scanner'){const bb=e.y+e.beamH;if(player.x<sx+e.w+6&&player.x+player.width>sx-2&&player.y<bb&&player.y+(player.sliding?28:player.height)>e.y){hitPlayer();if(gameState!=='playing')return;}}
}

// Powerups
for(let i=powerups.length-1;i>=0;i--){
const p=powerups[i];if(p.collected)continue;p.bob+=.08;
const sx=w2s(p.x);p.screenX=sx;if(sx<-40){powerups.splice(i,1);continue;}
const dx=(player.x+15)-sx,dy=(player.y+25)-(p.y+Math.sin(p.bob)*6);
if(dx*dx+dy*dy<40*40){p.collected=true;activatePower(p.type);if(p.type==='life')SFX.life();else SFX.powerup();flash(p.color,.25);ringBurst(sx,p.y,p.color);addScore(30);}
}

// Stars
for(let i=starPickups.length-1;i>=0;i--){
const s=starPickups[i];if(s.collected)continue;
let sx=w2s(s.x);
if(player.magnet>0){const dx=(player.x+15)-sx,dy=(player.y+25)-s.y,d=Math.sqrt(dx*dx+dy*dy);if(d<180&&d>5){s.x+=(dx/d)*6;s.y+=(dy/d)*6;sx=w2s(s.x);}}
s.screenX=sx;if(sx<-30){starPickups.splice(i,1);continue;}
const dx=(player.x+15)-sx,dy=(player.y+25)-s.y;
if(dx*dx+dy*dy<36*36){s.collected=true;starsCollected++;starsUI.textContent=starsCollected;SFX.star();burst(sx,s.y,'#ffd600',8,3.5);addScore(20);}
}

// Finish
if(finishLine&&!isEndless){
finishLine.screenX=w2s(finishLine.x);
if(finishLine.screenX<player.x+player.width&&!finishLine.activated){
finishLine.activated=true;
let earned=1;if(starsCollected>=3)earned=2;if(starsCollected>=6)earned=3;
if(lives>=3&&vaultCount>=2)earned=Math.min(3,Math.max(earned,2));
showComplete(Math.min(3,earned));return;
}
}

// Parallax
const moveLayer=(arr,f)=>{arr.forEach(b=>{b.x-=speed*f;if(b.x+b.w<0){b.x=canvas.width+Math.random()*80;b.h=100+Math.random()*(f>.4?220:160);b.w=70+Math.random()*100;}});};
moveLayer(buildingsFar,.12);moveLayer(buildingsMid,.28);moveLayer(buildingsNear,.48);
neonSigns.forEach(n=>{n.x-=speed*.35;if(n.x+n.w<0){n.x=canvas.width+50;n.y=60+Math.random()*140;}});
if(player.grounded&&!player.sliding&&frame%3===0)particles.push({x:player.x+4+Math.random()*6,y:player.y+player.height,vx:-speed*.35+(Math.random()-.5)*1.5,vy:-Math.random()*1.8,life:12,maxLife:12,size:1.5+Math.random()*2,color:'#3a3a55',type:'dust'});
if(player.speedBoost>0&&frame%2===0)particles.push({x:player.x-5,y:player.y+20+Math.random()*20,vx:-3-Math.random()*2,vy:(Math.random()-.5)*2,life:12,maxLife:12,size:2,color:'#ff9100',type:'spark'});
if(player.wallRun>0&&frame%3===0)particles.push({x:player.x+player.width,y:player.y+20+Math.random()*30,vx:-1,vy:(Math.random()-.5)*2,life:10,maxLife:10,size:2,color:'#00e5ff',type:'spark'});
}

function activatePower(type){
if(type==='shield')player.shield=300;
if(type==='speed')player.speedBoost=240;
if(type==='magnet')player.magnet=360;
if(type==='jump')player.superJump=300;
if(type==='life'&&lives<MAX_LIVES){lives++;livesUI.textContent=lives;}
updatePowerUI();
}

function drawBuilding(b,shade,wa){
ctx.fillStyle=shade;ctx.fillRect(b.x,groundY-b.h,b.w,b.h);
ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(b.x+b.w-6,groundY-b.h,6,b.h);
if(b.h>160&&b.type!==0){ctx.strokeStyle='#1a1a2e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x+b.w*.5,groundY-b.h);ctx.lineTo(b.x+b.w*.5,groundY-b.h-18-b.type*6);ctx.stroke();
ctx.fillStyle=b.neon?'#00e5ff':'#445';ctx.beginPath();ctx.arc(b.x+b.w*.5,groundY-b.h-18-b.type*6,2.5,0,Math.PI*2);ctx.fill();}
if(b.windows){const rows=Math.floor(b.h/22),cols=Math.floor(b.w/16);
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(((r*7+c*13+Math.floor(b.x))%5)>1){ctx.fillStyle=`rgba(100,160,255,${wa*(.5+(r%3)*.15)})`;ctx.fillRect(b.x+7+c*15,groundY-b.h+8+r*20,7,11);}}
if(b.neon){ctx.fillStyle='rgba(0,229,255,.35)';ctx.fillRect(b.x+4,groundY-b.h+4,b.w-8,3);}
}
function drawStickman(x,y,sliding,runFrame,alpha=1){
ctx.save();ctx.globalAlpha=alpha;ctx.translate(x+15,y);
const legPhase=Math.sin(runFrame),armPhase=Math.sin(runFrame+Math.PI),isJumping=!player.grounded&&!sliding&&player.wallRun<=0;
if(player.shield>0&&alpha>.8){ctx.strokeStyle='rgba(0,230,118,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,28,32+Math.sin(frame*.15)*3,0,Math.PI*2);ctx.stroke();}
if(player.wallRun>0&&alpha>.8){ctx.strokeStyle='rgba(0,229,255,.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,28,30,0,Math.PI*2);ctx.stroke();}
if(alpha>.8){const gc=player.speedBoost>0?'rgba(255,145,0,.22)':'rgba(0,229,255,.18)';
const g=ctx.createRadialGradient(0,25,5,0,25,42);g.addColorStop(0,gc);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,25,42,0,Math.PI*2);ctx.fill();}
const bc=player.invincible>0&&frame%6<3?'#fff':player.speedBoost>0?'#ff9100':player.wallRun>0?'#80d8ff':'#00e5ff';
ctx.strokeStyle=bc;ctx.lineWidth=3.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor=bc;ctx.shadowBlur=alpha>.7?8:0;
if(sliding){
ctx.beginPath();ctx.moveTo(-14,28);ctx.quadraticCurveTo(2,24,20,26);ctx.stroke();
ctx.beginPath();ctx.arc(24,22,7.5,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.moveTo(12,25);ctx.lineTo(32,14);ctx.lineTo(36,18);ctx.moveTo(-6,27);ctx.lineTo(-18,20);
ctx.moveTo(-10,30);ctx.lineTo(-26,38);ctx.lineTo(-22,44);ctx.moveTo(-6,32);ctx.lineTo(-16,42);ctx.stroke();
}else if(player.wallRun>0){
ctx.beginPath();ctx.arc(4,7,8,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.moveTo(4,15);ctx.lineTo(8,38);ctx.stroke();
ctx.beginPath();ctx.moveTo(6,22);ctx.lineTo(18,18);ctx.moveTo(6,22);ctx.lineTo(16,30);ctx.stroke();
ctx.beginPath();ctx.moveTo(8,38);ctx.lineTo(4,52);ctx.moveTo(8,38);ctx.lineTo(14,50);ctx.stroke();
}else if(isJumping){
ctx.beginPath();ctx.arc(0,7,8,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,15);ctx.lineTo(2,38);ctx.stroke();
ctx.beginPath();ctx.moveTo(1,20);ctx.lineTo(-14,10);ctx.moveTo(1,20);ctx.lineTo(16,8);ctx.stroke();
const tuck=Math.min(1,Math.abs(player.vy)/12);
ctx.beginPath();ctx.moveTo(2,38);ctx.lineTo(-10-tuck*4,50-tuck*6);ctx.moveTo(2,38);ctx.lineTo(12+tuck*3,52-tuck*4);ctx.stroke();
}else{
ctx.beginPath();ctx.arc(0,7,8,0,Math.PI*2);ctx.stroke();
ctx.fillStyle=bc;ctx.beginPath();ctx.arc(3,5,1.6,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.moveTo(0,15);ctx.lineTo(0,37);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(-13,26+armPhase*11);ctx.lineTo(-10,32+armPhase*6);
ctx.moveTo(0,20);ctx.lineTo(13,26-armPhase*11);ctx.lineTo(11,33-armPhase*5);ctx.stroke();
const legA=legPhase*12,legB=-legPhase*12;
ctx.beginPath();ctx.moveTo(0,37);ctx.lineTo(legA*.6,46);ctx.lineTo(legA,58);ctx.moveTo(0,37);ctx.lineTo(legB*.55,47);ctx.lineTo(legB,58);ctx.stroke();
}
ctx.shadowBlur=0;ctx.restore();
}
function drawEnemy(e){
const sx=e.screenX;if(sx===undefined||sx<-80||sx>canvas.width+80)return;
if(e.type==='drone'){
ctx.shadowColor=e.color;ctx.shadowBlur=12;ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.ellipse(sx+14,e.y+9,14,8,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(sx+14,e.y+9,5,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx+15,e.y+8,2,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='rgba(255,50,50,.6)';ctx.lineWidth=2;const spin=frame*.4;
ctx.beginPath();ctx.moveTo(sx+14+Math.cos(spin)*16,e.y+4);ctx.lineTo(sx+14-Math.cos(spin)*16,e.y+4);ctx.stroke();ctx.shadowBlur=0;
}else if(e.type==='bot'){
ctx.shadowColor=e.color;ctx.shadowBlur=10;ctx.fillStyle='#2a1520';ctx.fillRect(sx,e.y,e.w,e.h-8);
ctx.fillStyle=e.color;ctx.fillRect(sx+6,e.y+4,e.w-12,10);ctx.fillStyle='#fff';ctx.fillRect(sx+12,e.y+6,8,5);
const leg=Math.sin(e.phase)*5;ctx.fillStyle='#441a28';ctx.fillRect(sx+4,e.y+e.h-10,8,10+leg);ctx.fillRect(sx+20,e.y+e.h-10,8,10-leg);ctx.shadowBlur=0;
}else if(e.type==='scanner'){
ctx.fillStyle='#3a1520';ctx.fillRect(sx-4,e.y-8,16,12);ctx.fillStyle=e.color;ctx.fillRect(sx,e.y-4,8,6);
if(e.beamH>2){const g=ctx.createLinearGradient(sx,e.y,sx,e.y+e.beamH);g.addColorStop(0,'rgba(255,23,68,.7)');g.addColorStop(1,'rgba(255,23,68,.15)');
ctx.fillStyle=g;ctx.fillRect(sx+1,e.y,6,e.beamH);}
}
}
function drawGuard(){
const gx=w2sGuard();
if(gx<-60||gx>player.x-10)return;
// Silhouette guard
ctx.globalAlpha=.7;ctx.strokeStyle='#ff1744';ctx.lineWidth=3;ctx.shadowColor='#ff1744';ctx.shadowBlur=10;
ctx.save();ctx.translate(gx+12,groundY-55);
ctx.beginPath();ctx.arc(0,6,7,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,13);ctx.lineTo(0,32);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(-10,28);ctx.moveTo(0,18);ctx.lineTo(12,24);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,32);ctx.lineTo(-8,50);ctx.moveTo(0,32);ctx.lineTo(8,50);ctx.stroke();
// Gun hint
ctx.beginPath();ctx.moveTo(12,24);ctx.lineTo(22,22);ctx.stroke();
ctx.restore();ctx.shadowBlur=0;ctx.globalAlpha=1;
// Threat bar
if(guard.threat>20){
ctx.fillStyle='rgba(255,23,68,.3)';ctx.fillRect(10,groundY+8,Math.min(150,guard.threat*1.2),4);
ctx.fillStyle='#ff1744';ctx.fillRect(10,groundY+8,Math.min(150,guard.threat*1.2),4);
}
}
function w2sGuard(){return guard.x-distance+player.x;}

function draw(){
ctx.save();ctx.translate(shakeX,shakeY);
const sky=ctx.createLinearGradient(0,0,0,groundY);
sky.addColorStop(0,'#06061a');sky.addColorStop(.45,'#0c0c22');sky.addColorStop(.85,'#12122e');sky.addColorStop(1,'#1a1a35');
ctx.fillStyle=sky;ctx.fillRect(-20,-20,canvas.width+40,groundY+20);
starsBg.forEach(s=>{const tw=.5+.5*Math.sin(frame*.04+s.twinkle);ctx.globalAlpha=s.alpha*tw;ctx.fillStyle='#e0e8ff';ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill();});
ctx.globalAlpha=1;
// Rain
ctx.strokeStyle='rgba(150,180,255,.15)';ctx.lineWidth=1;
rain.forEach(r=>{ctx.beginPath();ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-1.5,r.y+r.len);ctx.stroke();});
ctx.fillStyle='rgba(20,20,50,.35)';ctx.fillRect(0,groundY-180,canvas.width,180);
buildingsFar.forEach(b=>drawBuilding(b,'#0a0a18',.15));
buildingsMid.forEach(b=>drawBuilding(b,'#0e0e20',.28));
buildingsNear.forEach(b=>drawBuilding(b,'#121228',.42));
neonSigns.forEach(n=>{ctx.globalAlpha=n.alpha*(.7+.3*Math.sin(frame*.06+n.x));ctx.shadowColor=n.color;ctx.shadowBlur=12;ctx.fillStyle=n.color;ctx.fillRect(n.x,n.y,n.w,n.h);ctx.fillRect(n.x,n.y,3,n.h+18);ctx.shadowBlur=0;});
ctx.globalAlpha=1;
const gg=ctx.createLinearGradient(0,groundY,0,canvas.height);gg.addColorStop(0,'#12122a');gg.addColorStop(1,'#080814');
ctx.fillStyle=gg;ctx.fillRect(0,groundY,canvas.width,canvas.height-groundY);
ctx.strokeStyle='rgba(0,229,255,.55)';ctx.lineWidth=2;ctx.shadowColor='#00e5ff';ctx.shadowBlur=10;
ctx.beginPath();ctx.moveTo(0,groundY);ctx.lineTo(canvas.width,groundY);ctx.stroke();ctx.shadowBlur=0;

// Walls
walls.forEach(w=>{
if(w.screenX===undefined||w.screenX<-30||w.screenX>canvas.width+30)return;
ctx.fillStyle='#1a2a4a';ctx.fillRect(w.screenX,w.y,w.w,w.h);
ctx.strokeStyle='rgba(0,229,255,.4)';ctx.lineWidth=2;ctx.strokeRect(w.screenX,w.y,w.w,w.h);
ctx.fillStyle='rgba(0,229,255,.1)';for(let i=0;i<6;i++)ctx.fillRect(w.screenX+3,w.y+10+i*25,w.w-6,3);
});

starPickups.forEach(s=>{
if(s.collected||s.screenX===undefined||s.screenX<-20||s.screenX>canvas.width+20)return;
const pulse=1+.15*Math.sin(frame*.12);ctx.shadowColor='#ffd600';ctx.shadowBlur=12;ctx.fillStyle='#ffd600';
ctx.save();ctx.translate(s.screenX,s.y);ctx.scale(pulse,pulse);ctx.beginPath();
for(let i=0;i<4;i++){const a=i*Math.PI/2-Math.PI/4;ctx.lineTo(Math.cos(a)*9,Math.sin(a)*9);ctx.lineTo(Math.cos(a+Math.PI/4)*4,Math.sin(a+Math.PI/4)*4);}
ctx.closePath();ctx.fill();ctx.restore();ctx.shadowBlur=0;
});
powerups.forEach(p=>{
if(p.collected||p.screenX===undefined||p.screenX<-30||p.screenX>canvas.width+30)return;
const by=p.y+Math.sin(p.bob)*6;ctx.shadowColor=p.color;ctx.shadowBlur=16;
ctx.strokeStyle=p.color;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.screenX,by,p.r+Math.sin(frame*.1)*2,0,Math.PI*2);ctx.stroke();
ctx.fillStyle=p.color+'33';ctx.beginPath();ctx.arc(p.screenX,by,p.r-2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle=p.color;ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.icon,p.screenX,by);
});
obstacles.forEach(o=>{
if(o.screenX===undefined||o.screenX<-60||o.screenX>canvas.width+60)return;
if(o.type==='mine'){
ctx.shadowColor=o.glow;ctx.shadowBlur=10;
ctx.fillStyle='#333';ctx.beginPath();ctx.arc(o.screenX+11,o.y+7,10,0,Math.PI*2);ctx.fill();
ctx.fillStyle=frame%20<10?'#ffeb3b':'#ff9800';ctx.beginPath();ctx.arc(o.screenX+11,o.y+7,5,0,Math.PI*2);ctx.fill();
ctx.shadowBlur=0;return;
}
ctx.shadowColor=o.glow;ctx.shadowBlur=16;ctx.fillStyle=o.color;ctx.fillRect(o.screenX,o.y,o.w,o.h);ctx.shadowBlur=0;
ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(o.screenX+3,o.y+3,o.w-6,o.h-6);
if(o.vaulted){ctx.fillStyle='rgba(255,214,0,.3)';ctx.fillRect(o.screenX,o.y,o.w,o.h);}
});
enemies.forEach(drawEnemy);
drawGuard();

if(finishLine&&finishLine.screenX!==undefined&&!isEndless){
const fx=finishLine.screenX;
if(fx>-40&&fx<canvas.width+40){
ctx.shadowColor='#00e676';ctx.shadowBlur=20;ctx.fillStyle='#00e676';
ctx.fillRect(fx,groundY-110,8,110);ctx.fillRect(fx+50,groundY-110,8,110);ctx.fillRect(fx,groundY-118,58,10);
const pg=ctx.createLinearGradient(fx+8,0,fx+50,0);pg.addColorStop(0,'rgba(0,230,118,.15)');pg.addColorStop(.5,'rgba(0,230,118,.45)');pg.addColorStop(1,'rgba(0,230,118,.15)');
ctx.fillStyle=pg;ctx.fillRect(fx+8,groundY-110,42,110);ctx.shadowBlur=0;
ctx.fillStyle='#00e676';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('SORTIE',fx+29,groundY-125);
}
}
particles.forEach(p=>{const a=p.life/(p.maxLife||30);ctx.globalAlpha=a;ctx.fillStyle=p.color;
if(p.type==='spark'){ctx.beginPath();ctx.arc(p.x,p.y,p.size*a,0,Math.PI*2);ctx.fill();}else ctx.fillRect(p.x,p.y,p.size,p.size*.7);});
ctx.globalAlpha=1;
confetti.forEach(c=>{ctx.save();ctx.globalAlpha=c.life/c.maxLife;ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.fillStyle=c.color;ctx.fillRect(-c.size/2,-c.size/2,c.size,c.size*.6);ctx.restore();});
ctx.globalAlpha=1;
player.trail.forEach((t,i)=>drawStickman(t.x,t.y,t.sliding,player.runFrame-i*.4,(t.life/8)*.25));
if(gameState==='playing'||(gameState==='dead'&&frame%5<3)){if(player.invincible<=0||frame%4<2)drawStickman(player.x,player.y,player.sliding,player.runFrame,1);}
if(speed>7.5&&gameState==='playing'){ctx.strokeStyle=`rgba(0,229,255,${.08+(speed-7.5)*.02})`;ctx.lineWidth=1.5;
for(let i=0;i<8;i++){const ly=40+((i*47+frame*3)%(groundY-60));ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(25+speed*3,ly);ctx.stroke();}}
const vig=ctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.height*.35,canvas.width/2,canvas.height/2,canvas.height*.85);
vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.45)');
ctx.fillStyle=vig;ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop);}
initBackground();player.y=groundY-player.height;showMenu();loop();
</script>
</body>
</html>
